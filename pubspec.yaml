name: mindreader
description: "mindreader.quest — Dark Obsidian Tarot: phygital spread scanner, tactile digital table, 78-card almanac."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  google_fonts: ^6.2.1
  camera: ^0.11.1
  image_picker: ^1.1.2
  image: ^4.3.0
  http: ^1.2.2
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/cards/
