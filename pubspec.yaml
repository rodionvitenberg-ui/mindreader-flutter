name: mindreader
description: "mindreader.quest — Dark Obsidian Tarot: phygital spread scanner, tactile digital table, 78-card almanac."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  google_fonts: ^6.2.1
  camera: ^0.12.2
  image_picker: ^1.1.2
  image: ^4.3.0
  http: ^1.2.2
  shared_preferences: ^2.3.3
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  flutter_timezone: ^4.1.1
  speech_to_text: ^7.5.0
  flutter_tts: ^4.2.5
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  camera_platform_interface: ^2.15.0

flutter:
  uses-material-design: true
  assets:
    - assets/cards/
    - assets/decks/
    # Flutter includes only files directly in a listed directory — every
    # deck subfolder needs its own entry (tool/map_decks.py outputs NN.jpg).
    - assets/decks/rider_waite/
    - assets/decks/marseille/
    - assets/decks/oswald_wirth/
    - assets/decks/etteilla/
    - assets/decks/visconti_sforza/
    - assets/decks/vieville/
    - assets/decks/soimoi/
    # Lenormand packs: drop 01.jpg..36.jpg into assets/lenormand/<pack_id>/.
    - assets/lenormand/
    - assets/lenormand/antique_petit/
    - assets/lenormand/obsidian_gilded/
    - assets/lenormand/botanical_noir/
    # Rune stone textures: drop <rune_id>.png into assets/runes/<pack_id>/.
    - assets/runes/
    - assets/runes/obsidian_lavender/
    - assets/runes/nordic_bone/
    - assets/runes/blood_jasper/
  fonts:
    - family: Allo
      fonts:
        - asset: assets/fonts/allo/Allo-Light.otf
          weight: 300
        - asset: assets/fonts/allo/Allo-Regular.otf
          weight: 400
        - asset: assets/fonts/allo/Allo-Oblique.otf
          weight: 400
          style: italic
        - asset: assets/fonts/allo/Allo-Medium.otf
          weight: 500
        - asset: assets/fonts/allo/Allo-MediumOblique.otf
          weight: 500
          style: italic
        - asset: assets/fonts/allo/Allo-SemiBold.otf
          weight: 600
        - asset: assets/fonts/allo/Allo-Bold.otf
          weight: 700
        - asset: assets/fonts/allo/Allo-BoldOblique.otf
          weight: 700
          style: italic
        - asset: assets/fonts/allo/Allo-ExtraBold.otf
          weight: 800
        - asset: assets/fonts/allo/Allo-Black.otf
          weight: 900
    - family: AlloVariable
      fonts:
        - asset: assets/fonts/allo/AlloVariable.ttf
